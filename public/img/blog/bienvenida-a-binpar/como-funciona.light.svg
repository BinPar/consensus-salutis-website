<title id="t">Cómo funciona una consulta</title><desc id="d">La pregunta llega al comité de expertos, donde cada especialidad se consulta sobre su propio corpus. La respuesta enlaza cada afirmación con su cita y la decisión queda en manos del clínico. Debajo del comité, el gobierno del conocimiento revisa, versiona y comprueba el corpus.</desc>
