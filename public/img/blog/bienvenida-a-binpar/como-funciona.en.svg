<title id="t">How a query works</title><desc id="d">The question reaches the expert committee, where each specialty is consulted on its own corpus. The answer links every statement to its citation and the decision stays with the clinician. Beneath the committee, knowledge governance reviews, versions and checks the corpus.</desc>
