<title id="t">Dokumentu baten sarreraren lau urratsak</title><desc id="d">Lau zutabe segidan, dokumentua igo ondoren: bi irakurketa alderatuak, aipu zehatza duten unitateak, unitateko kontrolak eta argitaratu aurreko berrikuspen klinikoa, arreta humanoa eskatzen duen urratsa. Azpian, omisioaren aurkako araua: atal bakoitza unitate batean amaitzen da, edo arrazoiarekin baztertuta.</desc>
