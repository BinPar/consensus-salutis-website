<title id="t">Los cuatro tramos de la ingesta</title><desc id="d">Cuatro columnas en secuencia tras la subida del documento: dos lecturas contrastadas, unidades con su cita exacta, controles por unidad y revisión clínica antes de publicar, que es el tramo que exige atención humana. Debajo, la regla contra la omisión: cada sección acaba en una unidad o descartada con su motivo.</desc>
