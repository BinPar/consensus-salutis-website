<title id="t">The four stages of ingestion</title><desc id="d">Four columns in sequence after the document is uploaded: two compared readings, units with their exact citation, checks per unit and clinical review before publishing, the stage that requires human attention. Below, the rule against omission: every section ends in a unit or discarded with its reason.</desc>
