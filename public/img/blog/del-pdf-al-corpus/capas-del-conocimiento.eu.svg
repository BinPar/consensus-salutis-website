<title id="t">Erakunde baten ezagutza-geruzak</title><desc id="d">Hiru plano pilatuta: gida eta eskuliburuen oinarri komuna, erakundearen geruza propioa eta, gainean, zentroaren egokitzapena, beheko geruzetatik heredatzen duena eta gehitu, zuzendu edo kentzen duena. Argitaratzean, geruza bertsio berri batean konpilatzen da, eta haren mendeko zentroak eguneratu egiten dira.</desc>
