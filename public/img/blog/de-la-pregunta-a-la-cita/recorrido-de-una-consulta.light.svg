<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="Sora, ui-sans-serif, system-ui, sans-serif">
<title id="t">Recorrido de una consulta en el chat clínico</title><desc id="d">La pregunta pasa por un mapa de evidencia que la reparte entre Endocrinología y Nutrición, Nefrología y Farmacología, cada una sobre su corpus completo. Si falta un dato, se pregunta antes de responder. La respuesta une cada afirmación a su unidad y cada cita abre el pasaje en su fuente.</desc>
