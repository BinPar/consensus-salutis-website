<title id="t">Percorrido dunha consulta no chat clínico</title><desc id="d">A pregunta pasa por un mapa de evidencia que a reparte entre Endocrinoloxía e Nutrición, Nefroloxía e Farmacoloxía, cada unha sobre o seu corpus completo. Se falta un dato, pregúntase antes de responder. A resposta une cada afirmación á súa unidade e cada cita abre a pasaxe na súa fonte.</desc>
