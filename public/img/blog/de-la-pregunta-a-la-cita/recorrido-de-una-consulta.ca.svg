<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="Sora, ui-sans-serif, system-ui, sans-serif">
<title id="t">Recorregut d’una consulta al xat clínic</title><desc id="d">La pregunta passa per un mapa d’evidència que la reparteix entre Endocrinologia i Nutrició, Nefrologia i Farmacologia, cadascuna sobre el seu corpus complet. Si falta una dada, es pregunta abans de respondre. La resposta uneix cada afirmació a la seva unitat i cada cita obre el passatge a la seva font.</desc>
