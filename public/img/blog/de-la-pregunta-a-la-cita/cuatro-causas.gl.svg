<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="Sora, ui-sans-serif, system-ui, sans-serif">
<title id="t">Catro causas e catro condicións</title><desc id="d">Dúas columnas enfrontadas. Á esquerda, as catro causas polas que unha cita deixa de servir: orde de traballo, contexto, dato que falta e versión. Á dereita, a condición que evita cada unha.</desc>
<defs>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="rgba(0,188,187,0.06)" stroke-width="1"/></pattern>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12z" fill="#00BCBB"/></marker>
<marker id="al" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12z" fill="#f6ff53"/></marker>
<radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="rgba(0,188,187,0.10)"/><stop offset="1" stop-color="rgba(0,188,187,0)"/></radialGradient>
</defs>
<rect width="1200" height="600" fill="#06111f"/><rect width="1200" height="600" fill="url(#grid)"/><rect width="1200" height="600" fill="url(#glow)"/>
<text x="40" y="64" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#00BCBB" letter-spacing="1.5">POR QUE FALLA UNHA CITA</text>
<text x="660" y="64" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#00BCBB" letter-spacing="1.5">QUE O EVITA</text>
<rect x="40" y="92" width="500" height="104" rx="16" fill="rgba(21,34,48,0.92)" stroke="rgba(0,188,187,0.55)" stroke-width="2"/>
<text x="72" y="132" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#00BCBB" letter-spacing="1.5">ORDE</text>
<text x="72" y="168" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">Primeiro o texto, despois as citas</text>
<path d="M548 144 H652" fill="none" stroke="rgba(0,188,187,0.75)" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="92" width="500" height="104" rx="16" fill="rgba(0,188,187,0.12)" stroke="#00BCBB" stroke-width="2"/>
<text x="692" y="153" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#71fffe">O que non ten cita retírase</text>
<rect x="40" y="216" width="500" height="104" rx="16" fill="rgba(21,34,48,0.92)" stroke="rgba(0,188,187,0.55)" stroke-width="2"/>
<text x="72" y="256" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#00BCBB" letter-spacing="1.5">CONTEXTO</text>
<text x="72" y="292" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">A regra, repartida en páxinas</text>
<path d="M548 268 H652" fill="none" stroke="rgba(0,188,187,0.75)" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="216" width="500" height="104" rx="16" fill="rgba(0,188,187,0.12)" stroke="#00BCBB" stroke-width="2"/>
<text x="692" y="277" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#71fffe">Cada especialidade, o seu corpus enteiro</text>
<rect x="40" y="340" width="500" height="104" rx="16" fill="rgba(21,34,48,0.92)" stroke="rgba(0,188,187,0.55)" stroke-width="2"/>
<text x="72" y="380" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#00BCBB" letter-spacing="1.5">DATO</text>
<text x="72" y="416" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">Falta o dato que separa casos</text>
<path d="M548 392 H652" fill="none" stroke="rgba(0,188,187,0.75)" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="340" width="500" height="104" rx="16" fill="rgba(0,188,187,0.12)" stroke="#00BCBB" stroke-width="2"/>
<text x="692" y="401" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#71fffe">Pregúntase antes de responder</text>
<rect x="40" y="464" width="500" height="104" rx="16" fill="rgba(21,34,48,0.92)" stroke="rgba(0,188,187,0.55)" stroke-width="2"/>
<text x="72" y="504" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#00BCBB" letter-spacing="1.5">VERSIÓN</text>
<text x="72" y="540" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">Cita á edición equivocada</text>
<path d="M548 516 H652" fill="none" stroke="rgba(0,188,187,0.75)" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="464" width="500" height="104" rx="16" fill="rgba(0,188,187,0.12)" stroke="#00BCBB" stroke-width="2"/>
<text x="692" y="525" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#71fffe">A versión do centro do profesional</text>
</svg>
