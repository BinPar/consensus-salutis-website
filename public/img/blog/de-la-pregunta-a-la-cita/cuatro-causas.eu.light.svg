<rect x="660" y="464" width="500" height="104" rx="16" fill="rgba(0,109,121,0.102)" stroke="#006D79" stroke-width="2"/>
<text x="692" y="525" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#006D79">Profesionalaren zentroko bertsioa</text>
