<text x="692" y="153" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#006D79">Aipurik gabekoa kendu egiten da</text>
<rect x="40" y="216" width="500" height="104" rx="16" fill="#FFFFFF" stroke="rgba(0,109,121,0.468)" stroke-width="2"/>
<text x="72" y="256" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#006D79" letter-spacing="1.5">TESTUINGURUA</text>
<text x="72" y="292" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#05215E">Araua, orrietan sakabanatuta</text>
<path d="M548 268 H652" fill="none" stroke="rgba(0,109,121,0.637)" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="216" width="500" height="104" rx="16" fill="rgba(0,109,121,0.102)" stroke="#006D79" stroke-width="2"/>
<text x="692" y="277" text-anchor="start" font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#006D79">Espezialitate bakoitza, bere corpus osoa</text>
<rect x="40" y="340" width="500" height="104" rx="16" fill="#FFFFFF" stroke="rgba(0,109,121,0.468)" stroke-width="2"/>
