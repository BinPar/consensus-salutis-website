<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="Sora, ui-sans-serif, system-ui, sans-serif">
<title id="t">Lau arrazoi eta lau baldintza</title><desc id="d">Bi zutabe aurrez aurre. Ezkerrean, aipu batek balioa galtzeko lau arrazoiak: lan-ordena, testuingurua, falta den datua eta bertsioa. Eskuinean, bakoitza saihesten duen baldintza.</desc>
